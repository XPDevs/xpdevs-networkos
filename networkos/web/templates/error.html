<!doctype html>
<html lang="en" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{{ code }} · {{ product }}</title>
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
{% include "partials/icons.html" %}
<div class="error-page">
  <div class="error-card">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.5 8.5a13 13 0 0 1 17 0"/><path d="M6.5 12a8.5 8.5 0 0 1 11 0"/><path d="M9.5 15.5a4.2 4.2 0 0 1 5 0"/>
        <circle cx="12" cy="19" r="1.3" fill="currentColor" stroke="none"/>
      </svg>
    </span>
    <div class="error-code">{{ code }}</div>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    <div class="btn-row">
      <a class="btn btn--primary" href="/">Back to dashboard</a>
      <a class="btn" href="/login">Sign in</a>
    </div>
    <p class="text-xs dim mt-4">{{ product }} {{ version }}</p>
  </div>
</div>
</body>
</html>
